name: Bug report
description: Report incorrect or broken behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or evidence
      description: Give reproducible steps, logs or screenshots. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Which user, workflow or invariant is affected?
    validations:
      required: true
