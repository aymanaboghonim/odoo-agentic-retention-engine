name: Task
description: Track a bounded repo, documentation or implementation task.
title: "task: "
body:
  - type: textarea
    id: work
    attributes:
      label: Work
      description: What concrete change is needed?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Context
      description: Why is this needed? Link to the spec, ADR or parent issue.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: List observable acceptance criteria.
    validations:
      required: true
