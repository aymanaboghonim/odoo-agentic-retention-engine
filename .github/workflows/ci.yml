name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Local-parity checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      engine-db:
        image: pgvector/pgvector:0.8.7-pg15@sha256:9a169499888c9d75ad14d0401be64839d2c325f32e399098261589faff93d65c
        env:
          POSTGRES_DB: engine
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engine -d engine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://engine:ci-only-throwaway@127.0.0.1:5432/engine
      REQUIRE_DB_TESTS: "1"
      CI_PULL_REQUEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b
        with:
          version: 0.13.5
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      # F-062/F-068: pinned Terraform for scripts/check_terraform.sh; no AWS credentials in CI.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: make ci
