name: Deploy AWS MVP

# Manual only (#97). Runs in the protected `aws-mvp` environment (owner is the required
# reviewer; its role ARN and bucket are secrets, #142) and assumes the bootstrap deploy role through GitHub OIDC (F-068): no stored
# AWS keys. It pushes images and rolls out task definitions; it never runs Terraform.

on:
  workflow_dispatch:
    inputs:
      quality_override_reason:
        description: "Only when G4/G5 warn in the evaluation report: which case failed and why it is acceptable, e.g. Held-out G4 EN 21/22, safe guard rejection; accepted in #156 (#157)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-aws-mvp
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, mirror, and roll out
    # #157: only after the evaluation gate passes, and only from main (the gate job also runs on
    # a branch dispatch, to show its result without reaching aws-mvp).
    needs: eval-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: aws-mvp
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      # #142: the repository is public. No build summary and no build-record artifact
      # (F-087); they carry the registry name.
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      # #142: first step, before anything prints. The role ARN and the bucket are
      # environment secrets (masked everywhere, even in step headers); this masks the
      # account ID taken from the ARN, which hides the ECR registry and task ARNs.
      - name: Mask the AWS account ID
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          acct=$(printf '%s' "$ROLE_ARN" | cut -d: -f5)
          case "$acct" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "AWS_DEPLOY_ROLE_ARN secret is missing or not an IAM role ARN" >&2; exit 1 ;;
          esac
          echo "::add-mask::$acct"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b
        with:
          version: 0.13.5
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # ADR-0026 / F-072: the host cannot reach the model CDN (IPv4 only), so the pinned
      # model is staged once in S3 from here. manifest.sha256 is written last, so its
      # presence means a complete, verified upload; the step is then skipped.
      - name: Stage the pinned embedding model in S3 (skipped when present)
        env:
          BACKUPS_BUCKET: ${{ secrets.AWS_BACKUPS_BUCKET }}
        run: |
          uv sync --locked --no-default-groups --group engine
          key=$(uv run --no-sync python -c 'from scripts.aws_mvp import _model_constants, model_snapshot_key; r, v, _ = _model_constants(); print(model_snapshot_key(r, v))')
          if aws s3api head-object --bucket "$BACKUPS_BUCKET" --key "$key/manifest.sha256" >/dev/null 2>&1; then
            echo "model already staged at $key"
          else
            uv run --no-sync python -m scripts.aws_mvp model-upload --bucket "$BACKUPS_BUCKET" --apply
          fi
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Mirror pinned third-party images (same digests)
        run: bash scripts/aws_mvp_mirror_images.sh "${{ steps.ecr.outputs.registry }}"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/full-stack.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/aorte-mvp/engine:${{ github.sha }}
      - name: Register task definitions and roll out
        run: bash scripts/aws_mvp_rollout.sh "${{ github.sha }}"

  # #157, ADR-0031 decision 4 (EVW-3, EVW-4): the commit's behavior fingerprint needs a merged
  # live evaluation report. No secrets and no environment; the reason comes in through env.
  eval-gate:
    name: Evaluation fingerprint gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b
        with:
          version: 0.13.5
          python-version: "3.14"
      - name: Check the evaluation report for this fingerprint
        env:
          PYTHONPATH: src
          QUALITY_OVERRIDE_REASON: ${{ inputs.quality_override_reason }}
        run: uv run --no-project python -m scripts.eval_deploy_gate
