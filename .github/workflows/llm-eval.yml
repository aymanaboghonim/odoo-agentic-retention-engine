name: LLM evaluation

# #135, ADR-0031: the live release-gate evaluation. Paid, so it is never part of `make ci` and
# never a required check. The evaluate job waits in the protected `llm-eval` environment: the
# owner approves to pay, or rejects (or leaves it pending) to skip. It runs the proposal step on
# fixture carts only (no Odoo, no execution, no channel) and traces to Langfuse US as `eval`.
# A finished report reaches `main` only through the PR the report job opens; the owner merges it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # EVW-2: exactly the covered files of scripts/eval_fingerprint.py (a test checks this).
    paths:
      - evals/llm/s2_golden_set.json
      - evals/llm/s2_reviews.json
      - evals/release/heldout_cases.json
      - policies/synthetic.json
      - scripts/poc2_evaluation_cases.py
      - scripts/poc2_evaluation_live.py
      - scripts/poc2_evaluation_runner.py
      - scripts/release_gate_cases.py
      - scripts/release_gate_ci.py
      - scripts/release_gate_eval.py
      - scripts/release_gate_gates.py
      - scripts/s2_llm_eval.py
      - src/engine/capacity_proposal.py
      - src/engine/fixed_rule.py
      - src/engine/full_stack_proposal.py
      - src/engine/gate_ledger.py
      - src/engine/policy.py
      - src/engine/privacy.py
      - src/engine/proposal.py
      - src/engine/proposal_budget.py
      - src/engine/proposal_provider.py
      - src/engine/retrieval.py

permissions: {}

concurrency:
  group: llm-eval
  cancel-in-progress: false

jobs:
  evaluate:
    name: Live evaluation (approval-gated)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: llm-eval
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      engine-db:
        image: pgvector/pgvector:0.8.7-pg15@sha256:9a169499888c9d75ad14d0401be64839d2c325f32e399098261589faff93d65c
        env:
          POSTGRES_DB: engine
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: eval-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engine -d engine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    outputs:
      report_dir: ${{ steps.live.outputs.report_dir }}
      fingerprint: ${{ steps.live.outputs.fingerprint }}
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      ENGINE_DATABASE_URL: postgresql://engine:eval-only-throwaway@127.0.0.1:5432/engine
      EVAL_THROWAWAY_DATABASE: "YES"
      TELEMETRY_ENABLED: "YES"
      TELEMETRY_ENVIRONMENT: eval
      TELEMETRY_EVAL_TEXT: "YES"
      LANGFUSE_OTLP_ENDPOINT: https://us.cloud.langfuse.com/api/public/otel
      # About 6 observations per case and 110 cases; Hobby includes 50k units a month (F-010).
      TELEMETRY_DAILY_LANGFUSE_UNIT_CAP: "2000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b
        with:
          version: 0.13.5
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked engine and retrieval dependencies
        run: uv sync --locked --no-default-groups --group engine --group retrieval-benchmark
      - name: Download the pinned embedding model
        run: |
          uv run --no-sync python -c 'from huggingface_hub import snapshot_download; from engine.retrieval import MODEL_FILES, MODEL_REPOSITORY, MODEL_REVISION; snapshot_download(repo_id=MODEL_REPOSITORY, revision=MODEL_REVISION, token=False, allow_patterns=MODEL_FILES)'
      # EVW-5: preflight before any paid call; it needs no secret.
      - name: Preflight (no provider call)
        run: uv run --no-sync python -m scripts.release_gate_ci --output-dir evals/release/results
      - id: live
        name: Run the evaluation (paid, hard ceiling in code)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: uv run --no-sync python -m scripts.release_gate_ci --output-dir evals/release/results --execute-live
      - name: Job summary
        env:
          REPORT_DIR: ${{ steps.live.outputs.report_dir }}
        run: cat "evals/release/results/$REPORT_DIR/README.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eval-report
          path: evals/release/results/${{ steps.live.outputs.report_dir }}
          if-no-files-found: error
          retention-days: 30

  report-pr:
    name: Open the report PR
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Needs "Allow GitHub Actions to create and approve pull requests". A PR opened with this
    # token starts its CI run only after the owner approves it (GitHub docs, facts register).
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: ${{ needs.evaluate.outputs.report_dir }}
      FINGERPRINT: ${{ needs.evaluate.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: eval-report
          path: evals/release/results/${{ needs.evaluate.outputs.report_dir }}
      - name: Open the tracking issue and the report PR
        run: |
          case "$REPORT_DIR" in eval-[0-9]*T[0-9]*Z-[0-9a-f]*) ;; *) echo "bad report dir" >&2; exit 1 ;; esac
          case "$FINGERPRINT" in *[!0-9a-f]*|"") echo "bad fingerprint" >&2; exit 1 ;; esac
          short="${FINGERPRINT:0:12}"
          url=$(gh issue create --title "eval: live evaluation report ${short}" \
            --body "Report of workflow run ${GITHUB_RUN_ID} for fingerprint \`${FINGERPRINT}\` (#135). Closed by its report PR.")
          issue="${url##*/}"
          branch="${issue}-eval-report-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "evals/release/results/$REPORT_DIR"
          git commit -m "eval: live evaluation report ${short}" -m "Refs #${issue}"
          git push origin "$branch"
          {
            echo "Closes #${issue}"
            echo
            echo "Live evaluation report from workflow run ${GITHUB_RUN_ID} (#135, ADR-0031)."
            echo "Approve this PR's CI run, read the report, then merge."
            echo
            cat "evals/release/results/$REPORT_DIR/README.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" --title "eval: live evaluation report ${short}" --body-file "$RUNNER_TEMP/pr-body.md"
