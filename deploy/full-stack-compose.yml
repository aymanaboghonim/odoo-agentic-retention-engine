services:
  odoo-db:
    image: postgres:15@sha256:64b99032e218b66b1d1a6334995056e1aa57f50a0c522cc856e72dff0e4b0d63
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${FULL_STACK_ODOO_DB_PASSWORD:?Set FULL_STACK_ODOO_DB_PASSWORD}
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  odoo:
    image: odoo:19.0@sha256:27f920e002c43a1af7022a68f3cc17db71a2f9f3348800cb050721ce54893e49
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: ${FULL_STACK_ODOO_DB_PASSWORD:?Set FULL_STACK_ODOO_DB_PASSWORD}
    ports:
      - "127.0.0.1:${FULL_STACK_ODOO_PORT:-18070}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    command: ["odoo", "--database=odoo", "--init=website_sale", "--with-demo", "--max-cron-threads=0"]
    networks: [private, ingress]

  engine-db:
    image: pgvector/pgvector:0.8.7-pg15@sha256:9a169499888c9d75ad14d0401be64839d2c325f32e399098261589faff93d65c
    environment:
      POSTGRES_DB: engine
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: ${FULL_STACK_ENGINE_DB_PASSWORD:?Set FULL_STACK_ENGINE_DB_PASSWORD}
    volumes:
      - engine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  initialize:
    build:
      context: ..
      dockerfile: deploy/full-stack.Dockerfile
    depends_on:
      odoo-db:
        condition: service_healthy
      odoo:
        condition: service_started
      engine-db:
        condition: service_healthy
    environment:
      FULL_STACK_SYNTHETIC_ISOLATED: "YES"
      FULL_STACK_ODOO_DB_PASSWORD: ${FULL_STACK_ODOO_DB_PASSWORD:?Set FULL_STACK_ODOO_DB_PASSWORD}
      FULL_STACK_ODOO_RO_PASSWORD: ${FULL_STACK_ODOO_RO_PASSWORD:?Set FULL_STACK_ODOO_RO_PASSWORD}
      ENGINE_DATABASE_URL: ${FULL_STACK_ENGINE_DATABASE_URL:?Set FULL_STACK_ENGINE_DATABASE_URL}
      # #166: optional locally (both or neither); the monitoring role is made only when set.
      FULL_STACK_ENGINE_MONITOR_PASSWORD: ${FULL_STACK_ENGINE_MONITOR_PASSWORD:-}
      FULL_STACK_ODOO_MONITOR_PASSWORD: ${FULL_STACK_ODOO_MONITOR_PASSWORD:-}
    command: ["python", "-m", "engine.full_stack_init"]
    networks: [private]

  worker:
    build:
      context: ..
      dockerfile: deploy/full-stack.Dockerfile
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment:
      FULL_STACK_SYNTHETIC_ISOLATED: "YES"
      FULL_STACK_INSTANCE_ID: ${FULL_STACK_INSTANCE_ID:?Set FULL_STACK_INSTANCE_ID}
      FULL_STACK_SCAN_PAGE_SIZE: ${FULL_STACK_SCAN_PAGE_SIZE:-50}
      FULL_STACK_SCAN_INTERVAL_SECONDS: ${FULL_STACK_SCAN_INTERVAL_SECONDS:-60}
      ENGINE_DATABASE_URL: ${FULL_STACK_ENGINE_DATABASE_URL:?Set FULL_STACK_ENGINE_DATABASE_URL}
      ODOO_READONLY_DATABASE_URL: ${FULL_STACK_ODOO_READONLY_DATABASE_URL:?Set FULL_STACK_ODOO_READONLY_DATABASE_URL}
      # Q12 (#85): empty SCAN_MODE keeps the default synthetic scan.
      SCAN_MODE: ${SCAN_MODE:-}
      ERP_SCAN_CHANNEL: ${ERP_SCAN_CHANNEL:-}
      CAMPAIGN_COOLDOWN_DAYS: ${CAMPAIGN_COOLDOWN_DAYS:-}
      # #87, ADR-0023: circuit breaker numbers from the measured release-gate baselines.
      RECONCILE_STALE_STARTED_MINUTES: ${RECONCILE_STALE_STARTED_MINUTES:-30}
      BREAKER_ENABLED: ${BREAKER_ENABLED:-YES}
      BREAKER_WINDOW_MINUTES: ${BREAKER_WINDOW_MINUTES:-15}
      BREAKER_MIN_SAMPLE: ${BREAKER_MIN_SAMPLE:-20}
      BREAKER_MAX_FAILURE_RATE_PERCENT: ${BREAKER_MAX_FAILURE_RATE_PERCENT:-10}
      BREAKER_MAX_P95_SECONDS: ${BREAKER_MAX_P95_SECONDS:-15}
      PRIVACY_RETENTION_DAYS: ${PRIVACY_RETENTION_DAYS:-}
      PRIVACY_TOMBSTONE_PEPPER: ${PRIVACY_TOMBSTONE_PEPPER:-}
      # #126, ADR-0029: telemetry is off unless set; with YES every Grafana setting is required.
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-NO}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-}
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_OTLP_TOKEN: ${GRAFANA_OTLP_TOKEN:-}
      TELEMETRY_DAILY_SPAN_CAP: ${TELEMETRY_DAILY_SPAN_CAP:-}
      TELEMETRY_APM: ${TELEMETRY_APM:-NO}
      TELEMETRY_DAILY_APM_SPAN_CAP: ${TELEMETRY_DAILY_APM_SPAN_CAP:-}
    command: ["python", "-m", "engine.full_stack_worker"]
    networks: [private]

  approval-api:
    build:
      context: ..
      dockerfile: deploy/full-stack.Dockerfile
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment:
      ENGINE_DATABASE_URL: ${FULL_STACK_ENGINE_DATABASE_URL:?Set FULL_STACK_ENGINE_DATABASE_URL}
      # #86: OIDC/JWKS verification; local dev uses a generated key (scripts/dev_oidc.py).
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:?Set OIDC_ROLES_CLAIM}
      OIDC_JWKS_FILE: /run/oidc/jwks.json
      APPROVAL_TTL_HOURS: ${APPROVAL_TTL_HOURS:-}
      APPROVAL_API_PORT: "8080"
      RECONCILE_STALE_STARTED_MINUTES: ${RECONCILE_STALE_STARTED_MINUTES:-30}  # #131
      # #126, ADR-0029: telemetry is off unless set; with YES every Grafana setting is required.
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-NO}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-}
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_OTLP_TOKEN: ${GRAFANA_OTLP_TOKEN:-}
      TELEMETRY_DAILY_SPAN_CAP: ${TELEMETRY_DAILY_SPAN_CAP:-}
      TELEMETRY_APM: ${TELEMETRY_APM:-NO}
      TELEMETRY_DAILY_APM_SPAN_CAP: ${TELEMETRY_DAILY_APM_SPAN_CAP:-}
    volumes:
      - ${FULL_STACK_OIDC_DIR:?Set FULL_STACK_OIDC_DIR}:/run/oidc:ro
    command: ["python", "-m", "engine.approval_api"]
    # #126: loopback-only liveness; checks the engine database without data or auth.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [private]

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:${FULL_STACK_MAILPIT_PORT:-18025}:8025"
    networks: [private, ingress]

  # ADR-0033, OBS-14: host metrics only (read-only /proc and /sys; no Docker socket, no host
  # root). Off by default: `--profile observability` with the Grafana settings and the two
  # monitoring passwords exported (without them pg_up is 0; #166).
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: [run, --disable-reporting, --storage.path=/tmp/data, /etc/alloy/config.alloy]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    environment:
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_OTLP_TOKEN: ${GRAFANA_OTLP_TOKEN:-}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-local}
      ENGINE_MONITOR_PASSWORD: ${FULL_STACK_ENGINE_MONITOR_PASSWORD:-}
      ODOO_MONITOR_PASSWORD: ${FULL_STACK_ODOO_MONITOR_PASSWORD:-}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [private, egress]

  proposal:
    profiles: [proposal]
    build:
      context: ..
      dockerfile: deploy/full-stack.Dockerfile
    environment:
      FULL_STACK_SYNTHETIC_ISOLATED: "YES"
      FULL_STACK_INSTANCE_ID: ${FULL_STACK_INSTANCE_ID:?Set FULL_STACK_INSTANCE_ID}
      FULL_STACK_CAPACITY_PROPOSAL: ${FULL_STACK_CAPACITY_PROPOSAL:-}
      RECONCILE_STALE_STARTED_MINUTES: ${RECONCILE_STALE_STARTED_MINUTES:-30}  # #131
      RECONCILE_MAILPIT_API_URL: http://mailpit:8025
      ENGINE_DATABASE_URL: ${FULL_STACK_ENGINE_DATABASE_URL:?Set FULL_STACK_ENGINE_DATABASE_URL}
      ODOO_READONLY_DATABASE_URL: ${FULL_STACK_ODOO_READONLY_DATABASE_URL:?Set FULL_STACK_ODOO_READONLY_DATABASE_URL}
      PROPOSAL_SYNTHETIC_ONLY: ${FULL_STACK_PROPOSAL_SYNTHETIC_ONLY:-}
      PROPOSAL_BUDGET_USD: ${FULL_STACK_PROPOSAL_BUDGET_USD:-}
      PROPOSAL_INPUT_TOKEN_LIMIT: ${FULL_STACK_PROPOSAL_INPUT_TOKEN_LIMIT:-}
      PROPOSAL_OUTPUT_TOKEN_LIMIT: ${FULL_STACK_PROPOSAL_OUTPUT_TOKEN_LIMIT:-}
      PROPOSAL_REVIEW_ID: ${FULL_STACK_PROPOSAL_REVIEW_ID:-}
      PROPOSAL_REVIEW_BUDGET_USD: ${FULL_STACK_PROPOSAL_REVIEW_BUDGET_USD:-}
      GATE_TIMEZONE: ${GATE_TIMEZONE:-}
      GATE_CURRENCY: ${GATE_CURRENCY:-}
      GATE_DAILY_BUDGET: ${GATE_DAILY_BUDGET:-}
      GATE_CATEGORY_MIN_MARGINS: ${GATE_CATEGORY_MIN_MARGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ODOO_URL: http://odoo:8069
      ODOO_DB_NAME: odoo
      ODOO_API_KEY: ${FULL_STACK_ODOO_API_KEY:-}
      # Q12 (#85): ERP proposal/execution stay off unless explicitly set.
      APPROVAL_TTL_HOURS: ${APPROVAL_TTL_HOURS:-}
      PROPOSAL_ERP_MODE: ${PROPOSAL_ERP_MODE:-}
      EXECUTION_ERP_MODE: ${EXECUTION_ERP_MODE:-}
      PRIVACY_RETENTION_DAYS: ${PRIVACY_RETENTION_DAYS:-}
      PRIVACY_TOMBSTONE_PEPPER: ${PRIVACY_TOMBSTONE_PEPPER:-}
      # #126, ADR-0029: telemetry is off unless set; with YES every Grafana setting is required.
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-NO}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-}
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      GRAFANA_OTLP_TOKEN: ${GRAFANA_OTLP_TOKEN:-}
      TELEMETRY_DAILY_SPAN_CAP: ${TELEMETRY_DAILY_SPAN_CAP:-}
      TELEMETRY_APM: ${TELEMETRY_APM:-NO}
      TELEMETRY_DAILY_APM_SPAN_CAP: ${TELEMETRY_DAILY_APM_SPAN_CAP:-}
      EXECUTION_ALLOWLIST_DOMAINS: ${EXECUTION_ALLOWLIST_DOMAINS:-}
      EXECUTION_ALLOWLIST_EMAILS: ${EXECUTION_ALLOWLIST_EMAILS:-}
      TELEGRAM_ALLOWLIST_CHAT_IDS: ${TELEGRAM_ALLOWLIST_CHAT_IDS:-}
      ERP_TELEGRAM_CHAT_ID: ${ERP_TELEGRAM_CHAT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HF_HOME: /model-cache
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${FULL_STACK_MODEL_CACHE:-/tmp}:/model-cache:ro
    networks: [private, egress]

networks:
  private:
    internal: true
  egress:
  ingress:

volumes:
  odoo-db:
  odoo-data:
  engine-db:
