[project]
name = "odoo-agentic-retention-engine"
version = "0.1.0"
description = "Agentic AI retention layer for an existing Odoo commerce system"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]
llm-eval = [
    "google-genai==2.34.0",
    "openai==3.42.0",
]
retrieval-benchmark = [
    "fastembed==0.9.1",
    "psycopg[binary]==3.3.6",
    "qdrant-client==1.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
