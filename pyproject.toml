[project]
name = "odoo-agentic-retention-engine"
version = "0.1.0"
description = "Agentic AI retention layer for an existing Odoo commerce system"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev", "engine"]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
  "pytest==9.1.1",
  "python-hcl2==8.2.0",
  "ruff==0.17.2",
]
engine = [
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "fastapi==0.162.2",
    "psycopg[binary]==3.3.6",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]
llm-eval = [
    "google-genai==2.34.0",
    "openai==3.42.0",
]
retrieval-benchmark = [
    "fastembed==0.9.1",
    "psycopg[binary]==3.3.6",
    "qdrant-client==1.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pycodestyle]
# Owner, 2026-11-17: the formatter still wraps code at 100; E501 only flags lines over 120
# (long strings and comments the formatter cannot wrap). Raising line-length itself would
# reformat 87 files.
max-line-length = 120

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
